name: Host checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CXX: clang++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify tools
        run: |
          python3 --version
          clang++ --version
      - name: Publication inputs
        run: python3 tools/check_publication.py
      - name: Sanitized C++ tests
        shell: bash
        run: |
          set -o pipefail
          python3 tests/run.py --build-dir "$RUNNER_TEMP/arduboy-native" 2>&1 | tee "$RUNNER_TEMP/arduboy-native.log"
      - name: Python tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/arduboy-python.log"
      - name: Preserve test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/arduboy-*.log
          if-no-files-found: ignore
          retention-days: 7
